<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시험모아</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>시험모아</h1>
    <p>우리 반 시험 범위, 모아보자!</p>
  </header>

 <main>
   <section id="auth-box">
  <h2>시험모아 로그인</h2>

  <form id="auth-form">
    <label for="auth-email">이메일</label>
    <input
      id="auth-email"
      type="email"
      autocomplete="email"
      placeholder="이메일 주소"
      required
    >

    <label for="auth-password">비밀번호</label>
    <input
      id="auth-password"
      type="password"
      autocomplete="current-password"
      placeholder="비밀번호"
      minlength="8"
      required
    >

    <button type="submit" id="login-button">로그인</button>
    <button type="button" id="signup-button">회원가입</button>
  </form>

  <div id="signed-in" hidden>
    <p>로그인됨 · 시험모아를 이용할 준비가 됐어요.</p>
    <button type="button" id="logout-button">로그아웃</button>
  </div>

  <p id="auth-message" role="status"></p>
</section>
  <h2>과목별 시험 범위</h2>
  <p>확인할 과목을 선택하세요.</p>

  <div id="subject-buttons">
    <button type="button" data-subject="국어">국어</button>
    <button type="button" data-subject="수학">수학</button>
    <button type="button" data-subject="영어">영어</button>
    <button type="button" data-subject="중국어">중국어</button>
    <button type="button" data-subject="화학">화학</button>
    <button type="button" data-subject="생명과학">생명과학</button>
  </div>

  <section id="exam-detail" hidden>
  <h2 id="subject-title"></h2>
  <p id="exam-range"></p>

  <label for="range-input">시험 범위 입력</label>
  <textarea
    id="range-input"
    rows="5"
    placeholder="교과서 쪽수, 프린트 번호, 제외 범위 등을 적어 주세요."
  ></textarea>
   <label for="source-input">안내 출처</label>
<input
  type="text"
  id="source-input"
  placeholder="예: 11월 4일 화학 수업 안내"
  maxlength="200"
> 

<button type="button" id="save-range">범위 추가</button>
  <p id="save-message" role="status"></p>

<small>
  로그인한 사용자들이 함께 확인하는 시험 범위입니다.
  최신 내용은 과목 버튼을 다시 눌러 확인하세요.
</small>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
